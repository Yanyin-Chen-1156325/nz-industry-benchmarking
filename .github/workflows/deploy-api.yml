name: Deploy API

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API / Production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build self-contained API deployment package
        run: python -m pip install --target deployment-package .
      - name: Verify production import boundary
        run: >-
          PYTHONPATH=deployment-package python -c
          "import sys;
          from nz_industry_benchmarking.api.app import create_app;
          from nz_industry_benchmarking.api.config import AnalyticsBackend, ApiConfig;
          from nz_industry_benchmarking.api.databricks_repository import DatabricksSqlConfig;
          from nz_industry_benchmarking.benchmarking.config import BenchmarkConfig;
          sql = DatabricksSqlConfig('example.invalid', '/sql/example', 'not-a-credential');
          config = ApiConfig(BenchmarkConfig(), AnalyticsBackend.DATABRICKS_SQL, sql);
          app = create_app(config=config);
          assert config.analytics_backend is AnalyticsBackend.DATABRICKS_SQL;
          assert app.title == 'NZ Industry Benchmarking API';
          assert 'pyspark' not in sys.modules;
          assert 'delta' not in sys.modules"
      - name: Verify Spark runtimes are absent
        run: |
          test ! -e deployment-package/pyspark
          test ! -e deployment-package/delta
          test ! -e deployment-package/py4j
      - name: Log in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: nz-industry-benchmarking-api
          slot-name: Production
          package: deployment-package
