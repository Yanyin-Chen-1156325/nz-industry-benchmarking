[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-industry-benchmarking"
version = "0.1.0"
description = "A data platform for benchmarking New Zealand industries with public Stats NZ AES data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sql-connector==4.6.0",
    "fastapi==0.141.1",
    "uvicorn==0.47.0",
]

[project.scripts]
nz-industry-benchmarking-databricks = "nz_industry_benchmarking.databricks.job:main"

[project.optional-dependencies]
local-spark = [
    "delta-spark==4.4.0",
    "pyspark==4.2.0",
]
dev = [
    "httpx2==2.13.1",
    "pytest==8.4.2",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "spark: tests that require the shared local Spark/Delta session",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
